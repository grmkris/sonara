# Railway service config for apps/web.
# Referenced when you set "Config-as-code Path" to apps/web/railway.toml
# in the service settings (or via the Railway CLI).
#
# Build args (NEXT_PUBLIC_*) must be set in the Railway service's
# "Build → Build Args" panel — not "Variables" — because Next.js inlines
# them at build time.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/web/Dockerfile"
# Rebuild when web sources OR the shared packages it imports change. Includes
# apps/server/src/rpc because web imports the oRPC router *type* (`server/rpc`)
# — if the router's input/output types change, web must rebuild to stay in sync.
watchPatterns = [
  "apps/web/**",
  "apps/server/src/rpc/**",
  "packages/api/**",
  "packages/shared/**",
  "bun.lock",
  "package.json",
]

[deploy]
startCommand = "bun apps/web/server.js"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
