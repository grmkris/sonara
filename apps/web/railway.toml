# Railway service config for apps/web.
# Referenced when you set "Config-as-code Path" to apps/web/railway.toml
# in the service settings (or via the Railway CLI).
#
# Build args (NEXT_PUBLIC_*) must be set in the Railway service's
# "Build → Build Args" panel — not "Variables" — because Next.js inlines
# them at build time.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/web/Dockerfile"

[deploy]
startCommand = "bun apps/web/server.js"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
