# Railway service config for apps/server.
# Referenced when you set "Config-as-code Path" to apps/server/railway.toml
# in the service settings (or via the Railway CLI).

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/server/Dockerfile"
# Build context must be the repo root so workspace:* deps resolve.
# Railway respects this when the root service directory is "/".

[deploy]
startCommand = "bun run src/server.ts"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
