# Railway service config for apps/gateway (Caddy reverse proxy).
# Set "Config-as-code Path" to apps/gateway/railway.toml in the service
# settings. This is the ONLY public-facing service — attach the sonara.fm
# custom domain here. Set SERVER_URL / WEB_URL (and PORT) in Variables; see
# DEPLOY.md §Gateway cutover.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/gateway/Dockerfile"
# Caddy has no turbo package; rebuild on any gateway source change.
watchPatterns = [
  "apps/gateway/**",
]

[deploy]
# Caddy reads PORT + SERVER_URL + WEB_URL from the env (see Caddyfile).
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
