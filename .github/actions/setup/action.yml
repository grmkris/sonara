name: "Setup Environment"
description: "Setup Bun and restore caches (mirrors stylelab)"

runs:
  using: "composite"
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.13"

    # Cache only the bun download pool (~tens of MB), not **/node_modules
    # (huge + the isolated linker's nested tree breaks tar restore). Restoring
    # the pool keeps `bun install --frozen-lockfile` fast.
    - name: Restore bun download pool
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-pool-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          bun-pool-${{ runner.os }}-

    - name: Create turbo directory
      shell: bash
      run: mkdir -p .turbo

    - name: Restore Turbo cache
      uses: actions/cache@v4
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ github.sha }}-${{ github.run_number }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ github.sha }}-
          turbo-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
