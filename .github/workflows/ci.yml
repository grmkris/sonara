name: CI Pipeline

on:
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - "**.md"
      - ".claude/**"
      - "docs/**"
      - ".vscode/**"
      - "LICENSE"
  push:
    branches: [main, dev]
    paths-ignore:
      - "**.md"
      - ".claude/**"
      - "docs/**"
      - ".vscode/**"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality - ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # check = ultracite check --type-aware --type-check (oxfmt format-check
        # + type-aware oxlint + full tsgo type-check) — the invok CI pattern.
        task: [lint, typecheck, check]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run ${{ matrix.task }}
        run: bun run ${{ matrix.task }}

  test:
    name: Test - Server
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # PGlite (WASM Postgres) intermittently crashes on CI runners (upstream
      # WASM instability). `test:ci` runs packages serially to bound memory;
      # the retry loop absorbs the residual flake. A genuinely broken test
      # fails on every attempt, so retries don't mask real failures.
      - name: Run tests
        env:
          NODE_ENV: test
          # apps/server/src/env.ts parses eagerly and strictly on import, and
          # several modules under test (db/pool → env) sit in test import
          # graphs. CI has no .env, so the required keys get dummies here —
          # tests never USE them (pools/clients are injected by the harness).
          # Until C1 removed apps/server's `bun test || echo` fallback, this
          # gap silently zeroed out every server test failure in CI.
          APP_ENV: local
          DATABASE_URL: postgres://test:test@localhost:5432/test
          BETTER_AUTH_SECRET: ci-test-secret-not-used-by-tests
          FAL_KEY: ci-test-key
          AUDD_API_KEY: ci-test-key
        run: |
          n=0
          until [ "$n" -ge 3 ]; do
            n=$((n + 1))
            echo "::group::Test attempt $n"
            if bun run test:ci; then
              echo "::endgroup::"
              echo "✅ tests passed on attempt $n"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::test attempt $n failed (likely PGlite WASM flake); retrying"
            sleep 5
          done
          echo "::error::tests failed after $n attempts"
          exit 1

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build all packages
        run: bun run build
        env:
          # next build requires APP_ENV identity (fail-loud); CI value is only
          # for compilation — Railway rebuilds with its own per-env build arg.
          NEXT_PUBLIC_APP_ENV: prod

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run security audit
        run: |
          echo "🔍 Checking for known vulnerabilities..."
          bun pm audit || {
            echo "::warning::Security vulnerabilities found. Review and update when possible."
          }
        continue-on-error: true

  all-checks-passed:
    name: CI Summary
    needs: [code-quality, test, build, security]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: CI Results Summary
        run: |
          echo "## 📊 CI Pipeline Results"
          if [ "${{ needs.code-quality.result }}" == "success" ] && \
             [ "${{ needs.test.result }}" == "success" ] && \
             [ "${{ needs.build.result }}" == "success" ]; then
            echo "### ✅ All CI checks passed!"
          else
            echo "### ❌ Some checks failed"
          fi
      - name: Fail if any job failed
        if: |
          needs.code-quality.result != 'success' ||
          needs.test.result != 'success' ||
          needs.build.result != 'success'
        run: exit 1
