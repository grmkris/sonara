[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

# Monad testnet (chain id 10143). Override the deployer key/RPC at the CLI:
#   forge create --rpc-url monad_testnet --private-key $DEPLOYER_KEY \
#     src/SonaraStage.sol:SonaraStage
[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"

[etherscan]
# MonadScan testnet verification (set MONADSCAN_API_KEY if verifying).
monad_testnet = { key = "${MONADSCAN_API_KEY}", url = "https://testnet.monadscan.com/api", chain = 10143 }
